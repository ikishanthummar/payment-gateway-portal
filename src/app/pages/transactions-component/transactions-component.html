<mat-card class="mat-elevation-z4">
  <div class="card-header">
    <mat-card-title>Transactions</mat-card-title>

    <mat-form-field appearance="outline" class="search-box">
      <mat-label>Search</mat-label>
      <input
        matInput
        [(ngModel)]="search"
        (keyup)="onSearch()" />
    </mat-form-field>
  </div>

  <div class="loader" *ngIf="loading">
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </div>

  <div class="table-wrapper" *ngIf="!loading">
    <table mat-table [dataSource]="transactions" matSort matSortDisableClear [matSortActive]="sortBy"
      [matSortDirection]="isDescending ? 'desc' : 'asc'" (matSortChange)="onSort($event)" class="full-width-table">

      <ng-container matColumnDef="transactionNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="transactionNumber">
          Trans. Number
        </th>
        <td mat-cell *matCellDef="let t">{{ t.transactionNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="orderNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="orderNumber">
          Order Number
        </th>
        <td mat-cell *matCellDef="let t">{{ t.orderNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="providerReference">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="providerReference">
          Provider
        </th>
        <td mat-cell *matCellDef="let t">{{ t.providerReference }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="amount">
          Amount
        </th>
        <td mat-cell *matCellDef="let t">₹ {{ t.amount }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="status">
          Status
        </th>
        <td mat-cell *matCellDef="let t">
          <span [ngClass]="t.status.toLowerCase()">
            {{ t.status }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdOn">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="createdOn">
          Created
        </th>
        <td mat-cell *matCellDef="let t">
          {{ t.createdOn | date:'short' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="updatedOn">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="updatedOn">
          Updated
        </th>
        <td mat-cell *matCellDef="let t">
          {{ t.updatedOn ? (t.updatedOn | date:'short') : 'N/A' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [length]="totalRecords" [pageSize]="pageSize" [pageIndex]="page - 1" [pageSizeOptions]="[5,10,20]"
      showFirstLastButtons (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</mat-card>

<mat-card class="mat-elevation-z4">
  <mat-card-header>
    <mat-card-title>Transactions</mat-card-title>
  </mat-card-header>
  <div class="loader" *ngIf="loading">
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </div>

  <div class="table-wrapper" *ngIf="!loading">
    <table mat-table [dataSource]="transactions" class="full-width-table">
      <!-- <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let t">{{ t.id }}</td>
      </ng-container> -->

      <ng-container matColumnDef="transactionNumber">
        <th mat-header-cell *matHeaderCellDef>Trans. Number</th>
        <td mat-cell *matCellDef="let t">{{ t.transactionNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="orderNumber">
        <th mat-header-cell *matHeaderCellDef>Ord. Number</th>
        <td mat-cell *matCellDef="let t">{{ t.orderNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="providerReference">
        <th mat-header-cell *matHeaderCellDef>Provider</th>
        <td mat-cell *matCellDef="let t">{{ t.providerReference }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let t">₹ {{ t.amount }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let t">
          <span class="status" [ngClass]="t.status.toLowerCase()">
            {{ t.status }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdOn">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let t">
          {{ t.createdOn | date:'short' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="updatedOn">
        <th mat-header-cell *matHeaderCellDef>Updated</th>
        <td mat-cell *matCellDef="let t">
          {{ t.updatedOn | date:'short' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [length]="totalRecords" [pageSize]="pageSize" [pageIndex]="page - 1" [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons (page)="onPageChange($event)">
    </mat-paginator>

  </div>

</mat-card>

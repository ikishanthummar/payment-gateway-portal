<mat-card class="payment-card">
    <mat-card-title>Initiate Payment</mat-card-title>

    <mat-card-content>
        <form class="payment-form">

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Amount</mat-label>
                <input matInput type="number" name="amount" [(ngModel)]="amount" #amountCtrl="ngModel" required min="1"
                    step="0.01" inputmode="decimal" (keydown)="blockInvalidKeys($event)" />
                <mat-error *ngIf="amountCtrl.invalid && amountCtrl.touched">
                    Amount is required and must be greater than 0
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Provider</mat-label>
                <mat-select [(ngModel)]="providerReference">
                    <mat-option *ngFor="let p of providers" [value]="p.name">
                        {{ p.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>


            <div class="action-row">
                <button mat-raised-button color="primary" (click)="payNow()" [disabled]="loading || amountCtrl.invalid">
                    Pay Now
                </button>

                <mat-progress-spinner *ngIf="loading" diameter="28" mode="indeterminate">
                </mat-progress-spinner>
            </div>

        </form>
    </mat-card-content>
</mat-card>
